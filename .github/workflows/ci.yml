# CI do domínio: o manifesto bate com o contrato do Nexus?
#
# Enquanto o domínio está vazio não há build pra rodar, mas há o que cobrar: o
# baluarte.module.js é o único arquivo que o orquestrador lê deste repositório.
# Manifesto quebrado só apareceria no boot do sistema todo — aqui aparece no PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato:
    name: Manifesto × contrato
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: O manifesto bate com o contrato v1.0.0?
        run: npm run verificar
